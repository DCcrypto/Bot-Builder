kind = "api"
previewPath = "/discord-bot-health"
title = "Discord Bot"
version = "1.0.0"
id = "Q9RmP2xwYzKaNbVeLf8h"

[[services]]
localPort = 3000
name = "Discord Bot"
paths = ["/discord-bot-health"]

[services.development]
run = "PORT=3000 pnpm --filter @workspace/discord-bot run start"

[services.production]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/discord-bot", "run", "start"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"

[services.production.health.startup]
path = "/discord-bot-health"
